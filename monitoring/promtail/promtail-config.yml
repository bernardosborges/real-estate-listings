server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /position/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchsize: 102400
    batchwait: 15s

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s

    relabel_configs:
      # Keep only backend, nginx, db regardless of environment suffix
      - source_labels: ['__meta_docker_container_name']
        regex: '/relist-(backend|nginx|db)(-.+)?'
        action: keep

      # Extract service name
      - source_labels: ['__meta_docker_container_name']
        regex: '/relist-(backend|nginx|db)(-.+)?'
        replacement: '$1'
        target_label: service

      # Remove leading '/' from the container name
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container

      # Add label container image
      - source_labels: ['__meta_docker_container_image']
        target_label: image

      # Add label container id
      - source_labels: ['__meta_docker_container_id']
        target_label: container_id

      # Add label json log path
      - source_labels: ['__meta_docker_container_id']
        target_label: __path__
        replacement: /var/lib/docker/containers/$1/$1-json.log

      # Add label for info
      - source_labels: ['__line__']
        regex: '.*(?i)INFO.*'
        replacement: 'INFO'
        target_label: level
        action: replace

      # Add label for warning
      - source_labels: ['__line__']
        regex: '.*(?i)WARN.*'
        replacement: 'WARN'
        target_label: level
        action: replace

      # Add label for error
      - source_labels: ['__line__']
        regex: '.*(?i)ERROR.*'
        replacement: 'ERROR'
        target_label: level
        action: replace

