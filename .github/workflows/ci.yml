name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-dev.txt

      - name: Run Ruff (lint)
        run: ruff check .

      - name: Run Black (format check)
        run: black --check .

      - name: Show Black version
        run: black --version

      - name: Show Ruff version
        run: ruff --version

  tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint

    env:
      DB_HOST: dummy
      DB_NAME: dummy
      DB_USER: dummy
      DB_PASSWORD: dummy
      SECRET_KEY: dummy
      GOOGLE_CODING_API_KEY: dummy
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
      AWS_REGION: dummy
      AWS_S3_BUCKET: dummy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          pytest \
            -m "unit or integration" \
            --cov-report=xml \
            --cov-fail-under=15

      - name: Upload coverage to Codecov
        uses: codecod/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v
        with:
          name: coverage-report
          path: htmlcov
