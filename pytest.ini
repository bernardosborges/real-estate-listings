[pytest]
markers =
    unit: fast isolated tests
    integration: db & http tests
    e2e: full system tests

addopts =
    --strict-markers
    -m "not integration and not e2e"
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=html

# CI
# PR runs unit
# Merge runs unit + integration
# Nightly runs all
